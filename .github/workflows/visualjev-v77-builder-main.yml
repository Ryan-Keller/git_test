name: VisualJev v7.7 APK Builder
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout v7.7 build branch
        uses: actions/checkout@v4
        with:
          ref: visualjev-v77-apk-build
          fetch-depth: 0

      - name: Reconstruct Android project
        shell: bash
        run: |
          set -euo pipefail
          cat visualjev-v7.7-apk/chunks/part00 \
              visualjev-v7.7-apk/chunks/part01 \
              visualjev-v7.7-apk/chunks/part02 \
              visualjev-v7.7-apk/chunks/part03 \
              visualjev-v7.7-apk/chunks/part04 \
              visualjev-v7.7-apk/chunks/part05 > project.b64
          base64 --decode project.b64 > project.zip
          mkdir buildsrc
          unzip -q project.zip -d buildsrc
          test -f buildsrc/settings.gradle.kts
          test -f buildsrc/app/src/main/assets/index.html
          python visualjev-v7.7-apk/patch-motion-sieve.py buildsrc/app/src/main/assets/index.html
          grep -q "MOTION_THRESHOLDS=\[6,12,18,28\]" buildsrc/app/src/main/assets/index.html
          grep -q "lower_motion_threshold_means_more_sensitive:true" buildsrc/app/src/main/assets/index.html
          cat > buildsrc/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=false
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          kotlin.code.style=official
          EOF
          python - <<'PY'
          from pathlib import Path
          p=Path("buildsrc/app/build.gradle.kts")
          s=p.read_text()
          marker="    buildTypes {"
          if "compileOptions {" not in s:
              s=s.replace(marker, "    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n\n"+marker, 1)
          p.write_text(s)
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        id: apkbuild
        continue-on-error: true
        working-directory: buildsrc
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Stage APK
        id: stage
        if: steps.apkbuild.outcome == 'success'
        run: |
          cp buildsrc/app/build/outputs/apk/debug/app-debug.apk VisualJev-v7.7-debug.apk
          ls -lh VisualJev-v7.7-debug.apk

      - name: Upload APK artifact
        if: steps.apkbuild.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: VisualJev-v7.7-APK
          path: VisualJev-v7.7-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Write result marker
        if: always()
        run: |
          mkdir -p visualjev-v7.7-apk
          cat > visualjev-v7.7-apk/build-result-main.json <<EOF
          {
            "run_id": "${{ github.run_id }}",
            "run_attempt": "${{ github.run_attempt }}",
            "workflow_sha": "${{ github.sha }}",
            "build_outcome": "${{ steps.apkbuild.outcome }}",
            "stage_outcome": "${{ steps.stage.outcome }}"
          }
          EOF
          git config user.name "VisualJev Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add visualjev-v7.7-apk/build-result-main.json
          git commit -m "[apk-result] VisualJev v7.7 main-builder result" || exit 0
          git push origin HEAD:visualjev-v77-apk-build

      - name: Fail if APK build failed
        if: steps.apkbuild.outcome != 'success'
        run: exit 1
