name: Build VisualJev v7.7 APK
on:
  push:
    branches:
      - visualjev-v77-apk-build
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct project
        shell: bash
        run: |
          set -euo pipefail
          cat visualjev-v7.7-apk/chunks/part00 \
              visualjev-v7.7-apk/chunks/part01 \
              visualjev-v7.7-apk/chunks/part02 \
              visualjev-v7.7-apk/chunks/part03 \
              visualjev-v7.7-apk/chunks/part04 \
              visualjev-v7.7-apk/chunks/part05 > project.b64
          base64 --decode project.b64 > project.zip
          mkdir buildsrc
          unzip -q project.zip -d buildsrc
          test -f buildsrc/settings.gradle.kts
          test -f buildsrc/app/src/main/assets/index.html
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: buildsrc
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Stage APK
        run: cp buildsrc/app/build/outputs/apk/debug/app-debug.apk VisualJev-v7.7-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VisualJev-v7.7-APK
          path: VisualJev-v7.7-debug.apk
          if-no-files-found: error
          retention-days: 14
